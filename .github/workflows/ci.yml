name: CI – BlackJack React

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

jobs:
  build-lint-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js Setup
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Stage 1 – Install
      - name: Install Dependencies
        run: npm ci

      # Stage 2 – Lint
      - name: Lint (ESLint)
        run: npm run lint

      # Stage 3 – Unit Tests
      - name: Unit Tests (Vitest)
        run: npm test

      # Stage 4 – Build
      - name: Build
        run: npm run build
